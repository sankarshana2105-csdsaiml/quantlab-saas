[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantlab"
version = "0.1.0"
description = "Full-stack quantitative research and backtesting SaaS"
requires-python = ">=3.12"
dependencies = ["alembic>=1.16", "email-validator>=2.2", "fastapi>=0.141", "numpy>=2.0", "pandas>=2.2", "psycopg[binary]>=3.2", "pwdlib[argon2]>=0.3", "PyJWT>=2.10", "sqlalchemy>=2.0", "uvicorn>=0.52"]

[project.optional-dependencies]
dev = ["httpx>=0.28", "pytest>=8.0"]
demo = ["matplotlib>=3.9"]

[tool.setuptools.packages.find]
include = ["quantlab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
