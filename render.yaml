databases:
  - name: quantlab-db
    databaseName: quantlab
    user: quantlab
    plan: free

services:
  - type: web
    name: quantlab-api
    runtime: python
    plan: free
    buildCommand: pip install .
    startCommand: alembic upgrade head && uvicorn quantlab.api.app:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: quantlab-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE_MINUTES
        value: 30
      - key: ENVIRONMENT
        value: production
      - key: MAX_DATASET_BARS
        value: 100000
      - key: CORS_ORIGINS
        sync: false
      - key: ALLOWED_HOSTS
        sync: false

  - type: web
    name: quantlab-web
    runtime: static
    rootDir: frontend
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
